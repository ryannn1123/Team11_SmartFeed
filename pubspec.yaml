name: smartfeed
description: SmartFeed - ESP32 Servo Controller

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.3.4
  http: ^1.2.1
  cupertino_icons: ^1.0.6
  geolocator: ^11.0.0
  url_launcher: ^6.2.6
  font_awesome_flutter: ^10.7.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/smartfeed_logo.png
    - .env
        
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/smartfeed_logo.png"